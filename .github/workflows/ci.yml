name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits so the PR merge commit's base parent (HEAD^1) is
          # available to the last_verified_at check below.
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint (Prettier check)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Generate JSON Schemas
        run: cd packages/schema && bun run generate-schemas

      # packages/schema is the single source of truth (CLAUDE.md 4), but the
      # generated .json schemas are what external consumers validate against.
      # If someone edits a Zod schema without regenerating, the two silently
      # diverge and the published schemas describe an older shape.
      - name: Check generated JSON Schemas are up to date
        run: git diff --exit-code packages/schema/schemas

      - name: Build dataset artifacts
        run: bun run data:build

      # No ALLOW_EMPTY: the 1999 network is committed, so an empty result now
      # means something broke. Keeping the opt-out would let a change that
      # empties or fails to write data/source/ pass validation - exactly the
      # regression the guard exists to catch.
      - name: Validate dataset (schema, graph integrity, provenance, perf budget)
        run: bun run data:validate

      # Warns (never fails) when a station/line/segment/override file changes
      # but its last_verified_at does not, so the footer's "Data verified"
      # date doesn't silently go stale. A typo fix needn't re-verify a record.
      - name: Check last_verified_at was bumped for changed data (warning)
        if: github.event_name == 'pull_request'
        run: bun run scripts/validate/check-verification-bumped.ts HEAD^1

      - name: Build web app
        run: cd apps/web && bun run build

      # CLAUDE.md 7's performance budget ("First load, compressed: < 300 KB")
      # was previously unenforced anywhere in CI, which is how a ~441 KB
      # regression (maplibre-gl bundled into the initial page load) shipped
      # unnoticed. This measures the actual gzip size of the JS/CSS assets
      # apps/web/out/index.html references on first load and fails the build
      # if the budget is exceeded.
      - name: Check bundle size budget
        run: cd apps/web && bun run check-bundle-size
